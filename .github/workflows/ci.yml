name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cxx: g++
          - os: ubuntu-latest
            cxx: clang++
          - os: macos-latest
            cxx: clang++
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Show tool versions
        run: ${{ matrix.cxx }} --version && python --version
      - name: Build C++ examples and run all tests
        env:
          CXX: ${{ matrix.cxx }}
          PYTHON: python
        run: ./scripts/run_all.sh
